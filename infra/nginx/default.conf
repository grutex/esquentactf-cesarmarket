server {
    listen 80 default_server;
    server_name _;
    root /var/www/frontend/html;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /css/ {
        root /var/www/frontend;
        try_files $uri =404;
    }
    location /js/ {
        root /var/www/frontend;
        try_files $uri =404;
    }
    location /imagens/ {
        root /var/www/frontend;
        try_files $uri =404;
    }
    location /html/ { return 404; }
    location = /style.css { return 308 /css/style.css$is_args$args; }
    location ~ ^/(api|script|conta|painel)\.js$ { return 308 /js/$1.js$is_args$args; }

    # URLs públicas não expõem a extensão dos arquivos do frontend.
    location = / { try_files /index.html =404; }
    location = /index { return 308 /$is_args$args; }
    location = /index.html { return 308 /$is_args$args; }
    location ~ ^/([a-zA-Z0-9-]+)\.html$ { return 308 /$1$is_args$args; }
    location ~ ^/(admin|gerenciar|conta|login|cadastro|categorias|produtos|hortifruti|produto|carrinho|checkout|pedido|acesso-negado)/$ { return 308 /$1$is_args$args; }

    location = /admin {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        auth_request /_authorize_admin;
        error_page 401 = @login_admin;
        error_page 403 /acesso-negado;
        try_files /admin.html =404;
    }
    location = /gerenciar {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        auth_request /_authorize_editor;
        error_page 401 = @login_editor;
        error_page 403 /acesso-negado;
        try_files /gerenciar.html =404;
    }
    location = /_authorize_admin {
        internal;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param REQUEST_URI /api/authorize/admin;
        fastcgi_param HTTP_COOKIE $http_cookie;
    }
    location @login_admin { return 302 /login?next=/admin; }
    location @login_editor { return 302 /login?next=/gerenciar; }
    location = /_authorize_editor {
        internal;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_pass_request_body off;
        fastcgi_param CONTENT_LENGTH "";
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param REQUEST_URI /api/authorize/editor;
        fastcgi_param HTTP_COOKIE $http_cookie;
    }
    location /api/ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /api/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 30s;
    }
    location /uploads/ {
        alias /var/www/uploads/;
        location ~* \.(?:php|phtml|phar|html|svg|js)$ { return 404; }
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { return 404; }
    location ~* \.(?:php|sql|ini|conf|env)$ { return 404; }
    location = /dados.js { return 404; }
    location / { try_files $uri $uri.html =404; }
}
