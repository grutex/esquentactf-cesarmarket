name: cesar-market-ctf

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-cesar_market}
      MARIADB_USER: ${DB_USERNAME:-cesar_market}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD no arquivo .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Preencha DB_ROOT_PASSWORD no arquivo .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - database_data:/var/lib/mysql
      - ./infra/database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks: [database]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 15
    stop_grace_period: 120s
    logging: *logging

  app:
    build:
      context: .
      dockerfile: infra/php/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-cesar_market}
      DB_USERNAME: ${DB_USERNAME:-cesar_market}
      DB_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD no arquivo .env}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador Cesar}
      ADMIN_LOGIN: ${ADMIN_LOGIN:-${ADMIN_EMAIL:-administrador}}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Preencha ADMIN_PASSWORD no arquivo .env}
      SESSION_SECURE: ${SESSION_SECURE:-false}
      WELCOME_CREDIT_CENTS: ${WELCOME_CREDIT_CENTS:-5000}
      DELIVERY_FEE_CENTS: ${DELIVERY_FEE_CENTS:-790}
      CTFD_BASE_URL: ${CTFD_BASE_URL:-http://localhost}
      UPLOAD_DIRECTORY: /var/www/uploads
      DOCUMENTS_DIRECTORY: /var/www/documentos
    depends_on:
      database: {condition: service_healthy}
    volumes:
      - uploads_data:/var/www/uploads
      - sessions_data:/var/lib/php/sessions
      - ./infra/documentos:/var/www/documentos:ro
    networks: [web, database]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["${APP_PORT:-8081}:80"]
    volumes:
      - ./frontend:/var/www/frontend:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      app: {condition: service_healthy}
    networks: [web]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  web:
  database: {internal: true}

volumes:
  database_data:
  uploads_data:
  sessions_data:
